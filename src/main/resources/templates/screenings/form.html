<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add screening')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="top">
    <section class="page-head">
        <div class="wrap">
            <p class="crumb"><a class="link" th:href="@{/movies/{id}(id=${movie.id})}">&larr; Back to the movie</a></p>
            <h1>Add a screening</h1>
            <p class="lead" th:text="${movie.title}">Movie title</p>
        </div>
    </section>

    <section class="section">
        <div class="wrap">
            <form class="form-page" method="post" th:action="@{/screenings}" th:object="${screeningForm}">
                <p class="error field" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>

                <input type="hidden" th:field="*{movieId}">

                <div class="field">
                    <label for="startTime">Start time</label>
                    <input id="startTime" type="datetime-local" th:field="*{startTime}">
                    <span class="field-error" th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}"></span>
                </div>

                <div class="field">
                    <label for="hall">Hall</label>
                    <input id="hall" type="text" th:field="*{hall}">
                    <span class="field-error" th:if="${#fields.hasErrors('hall')}" th:errors="*{hall}"></span>
                </div>

                <div class="field">
                    <label for="totalSeats">Total seats</label>
                    <input id="totalSeats" type="number" th:field="*{totalSeats}">
                    <span class="field-error" th:if="${#fields.hasErrors('totalSeats')}" th:errors="*{totalSeats}"></span>
                </div>

                <div class="field">
                    <label for="price">Price per seat</label>
                    <input id="price" type="number" step="0.01" th:field="*{price}">
                    <span class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
                </div>

                <div class="btn-row">
                    <button type="submit">Save</button>
                    <a class="btn btn--secondary" th:href="@{/movies/{id}(id=${movie.id})}">Cancel</a>
                </div>
            </form>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
