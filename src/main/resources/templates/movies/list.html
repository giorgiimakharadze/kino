<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Movies')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <h1>Movies</h1>
    <p class="notice" th:if="${message}" th:text="${message}"></p>

    <!-- Search, filter and sort (plain GET so the URL can be shared) -->
    <form class="inline-form" method="get" th:action="@{/movies}">
        <input type="text" name="title" placeholder="Search title" th:value="${title}">
        <select name="genre">
            <option value="">All genres</option>
            <option th:each="g : ${genres}" th:value="${g.name}" th:text="${g.name}"
                    th:selected="${g.name == genre}"></option>
        </select>
        <select name="sort">
            <option value="title" th:selected="${sort == 'title'}">Title</option>
            <option value="releaseDate" th:selected="${sort == 'releaseDate'}">Release date</option>
            <option value="durationMinutes" th:selected="${sort == 'durationMinutes'}">Duration</option>
        </select>
        <select name="dir">
            <option value="asc" th:selected="${dir == 'asc'}">Ascending</option>
            <option value="desc" th:selected="${dir == 'desc'}">Descending</option>
        </select>
        <button type="submit">Apply</button>
    </form>

    <p th:if="${movies.empty}">No movies found.</p>

    <div class="grid">
        <a class="card" th:each="m : ${movies.content}" th:href="@{/movies/{id}(id=${m.id})}">
            <img th:if="${m.posterPath}" th:src="@{/posters/{p}(p=${m.posterPath})}" th:alt="${m.title}">
            <div th:unless="${m.posterPath}" class="no-poster">No poster</div>
            <div class="body">
                <strong th:text="${m.title}">Title</strong><br>
                <small th:text="${m.durationMinutes} + ' min'">120 min</small>
            </div>
        </a>
    </div>

    <!-- Pagination: links keep the current filters and sorting -->
    <div class="pagination" th:if="${movies.totalPages > 1}">
        <a th:if="${movies.hasPrevious()}"
           th:href="@{/movies(page=${movies.number - 1}, title=${title}, genre=${genre}, sort=${sort}, dir=${dir})}">&laquo; Prev</a>
        <span class="current" th:text="'Page ' + ${movies.number + 1} + ' of ' + ${movies.totalPages}">Page 1 of 3</span>
        <a th:if="${movies.hasNext()}"
           th:href="@{/movies(page=${movies.number + 1}, title=${title}, genre=${genre}, sort=${sort}, dir=${dir})}">Next &raquo;</a>
    </div>
</main>
</body>
</html>
