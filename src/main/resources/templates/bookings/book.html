<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Book tickets')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="top">
    <section class="page-head">
        <div class="wrap">
            <p class="crumb"><a class="link" th:href="@{/movies/{id}(id=${screening.movie.id})}">&larr; Back to the movie</a></p>
            <h1>Book tickets</h1>
        </div>
    </section>

    <section class="section">
        <div class="wrap split">
            <!-- What you are booking -->
            <div class="panel">
                <h2 th:text="${screening.movie.title}" style="font-size: 28px">Title</h2>
                <dl>
                    <dt>When</dt>
                    <dd th:text="${#temporals.format(screening.startTime, 'dd MMM yyyy HH:mm')}">date</dd>
                    <dt>Hall</dt>
                    <dd th:text="${screening.hall}">Hall 1</dd>
                    <dt>Price</dt>
                    <dd th:text="${screening.price} + ' per seat'">10.00 per seat</dd>
                    <dt>Seats left</dt>
                    <dd th:text="${freeSeats} + ' of ' + ${screening.totalSeats}">5 of 20</dd>
                </dl>
            </div>

            <form method="post" th:action="@{/screenings/{id}/book(id=${screening.id})}" th:object="${bookingForm}">
                <p class="error field" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>

                <input type="hidden" th:field="*{screeningId}">

                <div class="field">
                    <label for="customerName">Your name</label>
                    <input id="customerName" type="text" th:field="*{customerName}">
                    <span class="field-error" th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}"></span>
                </div>

                <div class="field">
                    <label for="customerEmail">Email</label>
                    <input id="customerEmail" type="email" th:field="*{customerEmail}">
                    <span class="field-error" th:if="${#fields.hasErrors('customerEmail')}" th:errors="*{customerEmail}"></span>
                </div>

                <div class="field">
                    <label for="seats">Seats</label>
                    <input id="seats" type="number" min="1" th:field="*{seats}">
                    <span class="field-error" th:if="${#fields.hasErrors('seats')}" th:errors="*{seats}"></span>
                </div>

                <div class="btn-row">
                    <button type="submit">Book seats</button>
                    <a class="btn btn--secondary" th:href="@{/movies/{id}(id=${screening.movie.id})}">Cancel</a>
                </div>
            </form>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
