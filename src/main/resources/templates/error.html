<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="top">
    <section class="page-head center">
        <div class="wrap">
            <h1>Something went wrong</h1>
            <p class="lead error" th:text="${message ?: error ?: 'Unexpected error'}">Message</p>
            <p><span class="meta" th:if="${status}" th:text="'Error ' + ${status}">Error 400</span></p>
            <p><a class="btn" th:href="@{/movies}">Back to movies</a></p>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
