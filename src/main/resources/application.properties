spring.application.name=kino

# H2 in-memory database (console at /h2-console)
spring.datasource.url=jdbc:h2:mem:kinodb
spring.h2.console.enabled=true

# Let Hibernate create tables from entities; log SQL for debugging
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# File upload limits and the folder where posters are stored
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=uploads

# Lets HTML forms send PUT/DELETE through a hidden _method field
spring.mvc.hiddenmethod.filter.enabled=true
